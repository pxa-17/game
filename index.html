<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Love Adventure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- HOME -->
  <section id="homeScreen" class="screen active">
    <h1>🎁 A Magical Surprise Awaits</h1>
    <p>Complete all 44 levels to unlock every memory.</p>
    <button id="startBtn" class="primaryBtn">Start the Adventure</button>
  </section>

  <!-- MAP -->
  <section id="mapScreen" class="screen">
    <h2>🌈 Choose a Level</h2>
    <div id="levelMap"></div>
    <button id="backHome" class="secondaryBtn">Back Home</button>
  </section>

  <!-- GAME -->
  <section id="gameScreen" class="screen">
    <div id="topBar">
      <h3 id="levelTitle"></h3>
      <button id="backMap" class="secondaryBtn">Back to Map</button>
    </div>
    <div id="gameContainer"></div>
  </section>

  <!-- REWARD -->
  <section id="rewardScreen" class="screen">
    <h2>🎉 You Unlocked a Memory!</h2>
    <div id="rewardImageContainer"></div>
    <a id="downloadBtn" class="primaryBtn" download>Download Memory</a>
    <br>
    <button id="continueBtn" class="secondaryBtn">Continue</button>
  </section>

</div>
